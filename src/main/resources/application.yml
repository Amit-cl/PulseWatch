# ============================================================
# PulseWatch — Application Configuration
# ============================================================
# Environment variables override these defaults.
# Never commit real credentials to version control.
# ============================================================

spring:
  application:
    name: pulsewatch

  # -------- PostgreSQL --------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pulsewatch}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000      # 20 seconds
      idle-timeout: 300000            # 5 minutes
      max-lifetime: 600000            # 10 minutes

  # -------- JPA / Hibernate --------
  jpa:
    hibernate:
      ddl-auto: validate               # Flyway handles schema; Hibernate only validates
    open-in-view: false                 # Prevent lazy-loading leaks into controllers
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # -------- Flyway --------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # -------- Jackson --------
  jackson:
    serialization:
      write-dates-as-timestamps: false  # ISO-8601 date format
    default-property-inclusion: non_null

# ============================================================
# Server
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# ============================================================
# Actuator — expose health and info endpoints
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ============================================================
# PulseWatch custom settings
# ============================================================
pulsewatch:
  jwt:
    secret: ${JWT_SECRET:pulsewatch-dev-secret-key-change-in-production-min-32-chars!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours

  health-check:
    default-timeout-ms: 10000          # 10 seconds per request
    default-interval-seconds: 60       # 1 minute between checks
    max-concurrent-checks: 20          # bounded thread pool
    consecutive-failures-threshold: 3  # failures before opening incident
    consecutive-successes-threshold: 2 # successes before resolving incident

# ============================================================
# Logging
# ============================================================
logging:
  level:
    com.pulsewatch: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
